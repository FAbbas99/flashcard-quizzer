[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "venv"

[tool.isort]
profile = "black"
skip = ["venv"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["venv/", "htmlcov/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "tests/*", ".claude/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
